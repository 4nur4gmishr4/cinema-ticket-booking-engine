services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=sqlite:///./cinema.db
      - SECRET_KEY=frame-cinema-super-secret-jwt-key-2026-intern-assign
    volumes:
      - ./backend/cinema.db:/app/cinema.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8001
    depends_on:
      - backend
