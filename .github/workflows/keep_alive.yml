name: Keep Render Backend Active

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance from idling
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://cinema-ticket-booking-engine.onrender.com/api/health)
          echo "Render Backend Health Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Warning: Expected HTTP 200, got $STATUS"
          fi
